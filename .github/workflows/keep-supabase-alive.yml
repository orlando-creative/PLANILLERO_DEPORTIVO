name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los lunes, miércoles y viernes a las 12:00 UTC
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/${{ secrets.SUPABASE_TABLE }}?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
