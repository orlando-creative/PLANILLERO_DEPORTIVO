<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="escudoAzul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5b94" />
      <stop offset="100%" stop-color="#07223b" />
    </linearGradient>
    <linearGradient id="oroGradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd152" />
      <stop offset="50%" stop-color="#f4b41a" />
      <stop offset="100%" stop-color="#c98a00" />
    </linearGradient>
    <filter id="sombraEscudo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Escudo Base con borde dorado -->
  <path d="M 120,10 
           C 195,10 225,25 225,85 
           C 225,175 170,240 120,265 
           C 70,240 15,175 15,85 
           C 15,25 45,10 120,10 Z" 
        fill="url(#oroGradiente)" 
        filter="url(#sombraEscudo)" />

  <!-- Escudo Interior Azul -->
  <path d="M 120,18 
           C 187,18 215,31 215,85 
           C 215,168 165,230 120,253 
           C 75,230 25,168 25,85 
           C 25,31 53,18 120,18 Z" 
        fill="url(#escudoAzul)" />

  <!-- Bordura interna dorada -->
  <path d="M 120,26 
           C 180,26 205,38 205,85 
           C 205,160 160,218 120,240 
           C 80,218 35,160 35,85 
           C 35,38 60,26 120,26 Z" 
        fill="none" 
        stroke="url(#oroGradiente)" 
        stroke-width="3" 
        stroke-dasharray="8 4" />

  <!-- Sol / Rayos de Luz (Luz del Mundo) -->
  <g transform="translate(120, 95)">
    <!-- Rayos del sol -->
    <circle cx="0" cy="0" r="28" fill="#ffd152" opacity="0.2" />
    <path d="M 0,-42 L 0,42 M -42,0 L 42,0 M -30,-30 L 30,30 M -30,30 L 30,-30" stroke="#ffd152" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    
    <!-- Antorcha de la Luz / Saber -->
    <path d="M -9,12 L 9,12 L 5,38 L -5,38 Z" fill="url(#oroGradiente)" stroke="#07223b" stroke-width="1.5" />
    <ellipse cx="0" cy="12" rx="10" ry="3" fill="#ffd152" />
    <!-- Llama deportiva / institucional -->
    <path d="M 0,-15 C -12,2 -5,8 0,11 C 5,8 12,2 0,-15 Z" fill="#ffd152" />
    <path d="M 0,-8 C -6,2 -2,6 0,8 C 2,6 6,2 0,-8 Z" fill="#ffffff" />
  </g>

  <!-- Balón deportivo en la parte inferior -->
  <g transform="translate(120, 185)">
    <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#f4b41a" stroke-width="2" />
    <!-- Pentágono central -->
    <polygon points="0,-10 9,-3 6,8 -6,8 -9,-3" fill="#07223b" />
    <!-- Costuras del balón -->
    <line x1="0" y1="-10" x2="0" y2="-25" stroke="#07223b" stroke-width="1.8" />
    <line x1="9" y1="-3" x2="23" y2="-8" stroke="#07223b" stroke-width="1.8" />
    <line x1="6" y1="8" x2="16" y2="21" stroke="#07223b" stroke-width="1.8" />
    <line x1="-6" y1="8" x2="-16" y2="21" stroke="#07223b" stroke-width="1.8" />
    <line x1="-9" y1="-3" x2="-23" y2="-8" stroke="#07223b" stroke-width="1.8" />
  </g>

  <!-- Cinta Superior Institucional -->
  <path d="M 30,52 Q 120,38 210,52 L 205,74 Q 120,60 35,74 Z" fill="url(#oroGradiente)" />
  <text x="120" y="66" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="900" fill="#07223b" text-anchor="middle" letter-spacing="1">U.E. LUZ DEL MUNDO A</text>

  <!-- Letra "A" distintiva de la institución -->
  <text x="120" y="148" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="900" fill="#f4b41a" text-anchor="middle" letter-spacing="2">DEPORTES</text>
</svg>
