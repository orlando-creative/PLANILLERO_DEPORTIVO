<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Administrador | U.E. Luz del Mundo A</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header></header>
    <main class="contenedor" style="max-width:480px; margin-top:30px">
      <div class="panel">
        <h2 style="text-align:center">Acceso del Administrador</h2>
        <p style="text-align:center; color:var(--muted); margin-bottom:16px">Ingresa para controlar la mesa de planilla y partidos.</p>

        <div id="aviso-login" class="aviso" hidden></div>

        <form id="form-login">
          <div class="form-group">
            <label for="correo">Correo Electrónico</label>
            <input id="correo" type="email" placeholder="admin@colegio.edu" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button class="btn" type="submit" id="btn-login" style="width:100%; margin-top:8px">Ingresar a la Planilla</button>
        </form>

        <p style="text-align:center; margin-top:16px"><a href="index.html" style="color:var(--muted); font-size:.85rem">Volver al inicio</a></p>
      </div>
    </main>
    <footer></footer>

    <script type="module">
      import { montarNavegacion } from './js/app.js';
      import { iniciarSesion } from './js/supabase.js';
      montarNavegacion();

      const aviso = document.getElementById('aviso-login');
      // Valida las credenciales y muestra el resultado del inicio de sesión.
      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = 'Verificando...';
        try {
          await iniciarSesion(document.getElementById('correo').value, document.getElementById('password').value);
          window.location.href = 'administracion.html';
        } catch (err) {
          aviso.textContent = err.message || 'Error al iniciar sesión';
          aviso.className = 'aviso aviso-error';
          aviso.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Ingresar a la Planilla';
        }
      });
    </script>
  </body>
</html>
